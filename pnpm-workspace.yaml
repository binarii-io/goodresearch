packages:
  - apps/*
  - packages/*

# Supply chain: wait 3 days (minutes) before installing a new release.
minimumReleaseAge: 4320

# Only these packages may run install scripts.
allowBuilds:
  lefthook: true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

