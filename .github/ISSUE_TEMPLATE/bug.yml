name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      { label: What happened, description: "Steps to reproduce, expected and actual result." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version, description: "Image tag or commit." }
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      {
        label: Context,
        description: "Deployment, identity provider, browser. Never paste secrets or personal data.",
      }
