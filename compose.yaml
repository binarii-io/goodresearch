# goodresearch stack: `docker compose up -d` with a filled .env (see .env.example).
# For local evaluation with a test identity provider, add compose.dev.yaml (see README).
name: goodresearch

x-app: &app
  build: { context: ., dockerfile: docker/Dockerfile }
  image: goodresearch:local
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://goodresearch:goodresearch@postgres:5432/goodresearch
    S3_ENDPOINT: http://s3:8333

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: goodresearch
      POSTGRES_PASSWORD: goodresearch
      POSTGRES_DB: goodresearch
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodresearch"]
      interval: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-goodresearch}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-goodresearch-secret}
    volumes: [s3:/data]

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }

  server:
    <<: *app
    command: ["server"]
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres:
  s3:
